# Pallavi Wats's academic website, served by GitHub Pages.
locale: en-US
title: Pallavi Wats
title_separator: "-"
description: PhD Candidate in Economics
url: https://pallaviwats.github.io
baseurl: ""
repository: pallaviwats/pallaviwats.github.io

author:
  name: Pallavi Wats
  avatar: pal.jpg
  bio: PhD Candidate in Economics
  employer: University of Virginia
  location: Charlottesville, VA
  email: watspallavi@gmail.com
  github: pallaviwats
  linkedin: "https://www.linkedin.com/in/pallavi-wats-b04320190/"

include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache

encoding: utf-8
markdown: kramdown
highlighter: rouge
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
excerpt_separator: "\n\n"
future: true
permalink: /:categories/:title/
timezone: America/Los_Angeles

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: academic
  - scope:
      path: ""
      type: posts
    values:
      layout: academic

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
